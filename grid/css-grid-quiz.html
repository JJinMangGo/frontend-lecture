<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid 퀴즈</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-light: #eef2ff;
    --primary-dark: #3730a3;
    --text: #1e293b;
    --sub: #64748b;
    --muted: #94a3b8;
    --border: #e2e8f0;
    --correct-bg: #f0fdf4;
    --correct-bd: #16a34a;
    --correct-text: #15803d;
    --wrong-bg: #fef2f2;
    --wrong-bd: #dc2626;
    --wrong-text: #b91c1c;
    --code-bg: #1e1e2e;
    --radius: 14px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  /* 헤더 */
  .app-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .app-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: -0.5px;
  }
  .app-header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* 카드 */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    width: 100%;
    max-width: 680px;
    overflow: hidden;
  }

  /* 진행률 바 */
  .prog-bg {
    width: 100%;
    height: 5px;
    background: var(--border);
  }
  .prog-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 0 3px 3px 0;
    transition: width 0.4s ease;
  }

  /* 퀴즈 영역 */
  #qa { padding: 28px 28px 24px; }

  /* 문항 메타 */
  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .q-num {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .q-cat {
    font-size: 11px;
    font-weight: 600;
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* 문제 */
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 18px;
    color: var(--text);
  }

  /* 코드 블록 */
  .code-block {
    background: var(--code-bg);
    border-radius: 10px;
    padding: 14px 18px;
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    color: #cdd6f4;
    margin-bottom: 14px;
    line-height: 1.9;
    overflow-x: auto;
  }
  .code-block .cm   { color: #6c7086; }
  .code-block .prop { color: #89b4fa; }
  .code-block .val  { color: #a6e3a1; }
  .code-block .sel  { color: #cba6f7; }
  .code-block .blank {
    display: inline-block;
    background: #313244;
    border: 1.5px dashed #89b4fa;
    border-radius: 4px;
    min-width: 80px;
    height: 20px;
    vertical-align: middle;
  }

  /* 힌트 */
  .hint-box {
    border-left: 3px solid var(--primary);
    background: var(--primary-light);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: var(--primary-dark);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .hint-box strong { font-weight: 600; }

  /* 선택지 */
  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .opt-btn .opt-idx {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--bg);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }
  .opt-btn:hover:not(:disabled) {
    background: var(--primary-light);
    border-color: var(--primary);
  }
  .opt-btn:hover:not(:disabled) .opt-idx {
    background: var(--primary);
    color: #fff;
  }
  .opt-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-bd);
    color: var(--correct-text);
  }
  .opt-btn.correct .opt-idx { background: var(--correct-bd); color: #fff; }
  .opt-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-bd);
    color: var(--wrong-text);
  }
  .opt-btn.wrong .opt-idx { background: var(--wrong-bd); color: #fff; }

  /* 해설 */
  .explanation {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: #78350f;
    line-height: 1.7;
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
  }
  .explanation strong { font-weight: 600; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

  /* 네비게이션 */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
  }
  .nav-btn {
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--sub);
  }
  .nav-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--sub); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .nav-btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .q-progress-text { font-size: 12px; color: var(--muted); font-weight: 500; }

  /* 결과 화면 */
  .score-box { padding: 36px 28px; text-align: center; }
  .score-emoji { font-size: 48px; margin-bottom: 12px; }
  .score-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .score-msg { font-size: 14px; color: var(--sub); margin-bottom: 28px; line-height: 1.6; }
  .score-pct {
    font-size: 52px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 24px;
    letter-spacing: -2px;
  }
  .score-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .score-cell {
    background: var(--bg);
    border-radius: 10px;
    padding: 14px 10px;
  }
  .score-cell .sc-num { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .score-cell .sc-label { font-size: 12px; color: var(--muted); }
  .score-cell.c { color: var(--correct-text); }
  .score-cell.w { color: var(--wrong-text); }
  .score-cell.s { color: var(--muted); }
  .restart-btn {
    padding: 12px 32px;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
  }
  .restart-btn:hover { background: var(--primary-dark); }
</style>
</head>
<body>

<div class="app-header">
  <h1>CSS Grid 퀴즈</h1>
  <p>오늘 배운 Grid 개념을 확인해보세요 💪</p>
</div>

<div class="card">
  <div class="prog-bg"><div class="prog-fill" id="prog"></div></div>
  <div id="qa"></div>
</div>

<script>
const Q = [
  {
    cat: '기본 개념',
    q: 'CSS Grid를 활성화하는 속성은 무엇인가요?',
    code: null,
    hint: 'Flexbox를 활성화할 때도 비슷한 방식을 사용해요.',
    opts: ['display: grid', 'position: grid', 'layout: grid', 'grid: active'],
    ans: 0,
    ex: '<strong>display: grid</strong>를 부모 요소에 적용하면 자식 요소들이 그리드 아이템이 돼요. Flexbox의 display: flex와 같은 방식이에요.'
  },
  {
    cat: 'grid-template-columns',
    q: '다음 코드는 컬럼을 몇 개 만드나요?\n\ngrid-template-columns: repeat(4, 1fr);',
    code: `.container {\n  grid-template-columns: <span class="prop">repeat</span>(<span class="val">4, 1fr</span>);\n}`,
    hint: 'repeat(횟수, 크기)에서 첫 번째 인수가 반복 횟수예요.',
    opts: ['1개', '2개', '4개', '8개'],
    ans: 2,
    ex: '<strong>repeat(4, 1fr)</strong>은 같은 너비의 컬럼을 4개 만들어요. 1fr 1fr 1fr 1fr과 완전히 동일한 코드예요.'
  },
  {
    cat: 'fr 단위',
    q: 'fr 단위에 대한 설명으로 올바른 것은?',
    code: `.container {\n  grid-template-columns: <span class="val">2fr 1fr 1fr</span>;\n}`,
    hint: 'fr = fraction(비율)의 줄임말이에요.',
    opts: ['고정 픽셀 단위', '남은 공간의 비율', '폰트 크기 기준 단위', '뷰포트 기준 단위'],
    ans: 1,
    ex: '<strong>fr</strong>은 남은 공간을 비율로 나눠요. 2fr 1fr 1fr이면 전체를 4등분해서 첫 컬럼이 2/4, 나머지 둘이 각 1/4씩 차지해요.'
  },
  {
    cat: 'minmax()',
    q: 'minmax(120px, 1fr)의 의미로 올바른 것은?',
    code: `.container {\n  grid-template-columns: repeat(3, <span class="prop">minmax</span>(<span class="val">120px, 1fr</span>));\n}`,
    hint: 'minmax(최솟값, 최댓값) 형태로 범위를 지정해요.',
    opts: [
      '정확히 120px 고정 너비',
      '최소 120px, 최대 1fr(남은 공간)',
      '최소 1fr, 최대 120px',
      '120px와 1fr 중 큰 값'
    ],
    ans: 1,
    ex: '<strong>minmax(120px, 1fr)</strong>은 "최소 120px 이하로는 줄어들지 않고, 공간이 남으면 1fr만큼 늘어난다"는 뜻이에요.'
  },
  {
    cat: 'auto-fill vs auto-fit',
    q: 'repeat(auto-fill, minmax(150px, 1fr))에서 아이템이 2개뿐일 때, 빈 트랙은 어떻게 되나요?',
    code: `.container {\n  grid-template-columns: repeat(<span class="val">auto-fill</span>, minmax(150px, 1fr));\n}`,
    hint: 'auto-fill과 auto-fit의 차이는 빈 트랙 처리 방식이에요.',
    opts: [
      '빈 트랙이 0px로 접혀서 아이템이 전체 너비를 채운다',
      '빈 트랙도 공간을 차지해서 아이템이 왼쪽에 몰린다',
      '아이템이 자동으로 복제된다',
      '오류가 발생한다'
    ],
    ans: 1,
    ex: '<strong>auto-fill</strong>은 빈 트랙을 그대로 유지해요. 아이템이 적으면 빈 공간이 생겨서 왼쪽에 몰린 것처럼 보여요. 반면 <strong>auto-fit</strong>은 빈 트랙을 0px로 접어서 아이템들이 전체 너비를 채워요.'
  },
  {
    cat: 'auto-fill vs auto-fit',
    q: '카드가 항상 전체 너비를 꽉 채워야 하는 반응형 갤러리에 더 적합한 값은?',
    code: `.gallery {\n  grid-template-columns: repeat(<span class="blank"></span>, minmax(200px, 1fr));\n}`,
    hint: '아이템이 적어도 늘어나서 전체를 채우는 쪽을 선택하세요.',
    opts: ['auto-fill', 'auto-fit', 'auto', '1fr'],
    ans: 1,
    ex: '<strong>auto-fit</strong>은 빈 트랙을 접어버리기 때문에 아이템 수가 적어도 전체 너비를 꽉 채워요. 반응형 카드 레이아웃에 가장 많이 쓰이는 패턴이에요.'
  },
  {
    cat: 'grid-column / grid-row',
    q: '3×3 그리드에서 grid-column: 1 / 3은 몇 칸을 차지하나요?',
    code: `.item {\n  <span class="prop">grid-column</span>: <span class="val">1 / 3</span>;\n}`,
    hint: '그리드 라인 번호는 칸 번호가 아니라 선의 번호예요.',
    opts: ['1칸', '2칸', '3칸', '전체'],
    ans: 1,
    ex: 'grid-column: 1 / 3은 <strong>1번 라인부터 3번 라인까지</strong>예요. 3×3 그리드에서 라인은 1~4번까지 있고, 1번~3번 사이에 칸이 2개 있으므로 2칸을 차지해요.'
  },
  {
    cat: 'grid-column / grid-row',
    q: '다음 중 item이 2칸을 차지하는 코드가 아닌 것은?',
    code: null,
    hint: 'span N은 현재 위치에서 N칸을 차지하겠다는 뜻이에요.',
    opts: [
      'grid-column: 1 / 3',
      'grid-column: 2 / 4',
      'grid-column: span 2',
      'grid-column: 1 / 2'
    ],
    ans: 3,
    ex: '<strong>grid-column: 1 / 2</strong>는 1번 라인부터 2번 라인까지, 즉 1칸만 차지해요. 나머지 세 개는 모두 2칸을 차지하는 올바른 코드예요.'
  },
  {
    cat: 'grid-template-areas',
    q: '다음 grid-template-areas에서 header 영역은 몇 칸인가요?\n\n"header header header"\n"sidebar main main"\n"footer footer footer"',
    code: `.container {\n  grid-template-columns: repeat(3, 1fr);\n  grid-template-areas:\n    <span class="val">"header header header"</span>\n    <span class="val">"sidebar main main"</span>\n    <span class="val">"footer footer footer"</span>;\n}`,
    hint: '같은 이름이 반복된 횟수가 해당 영역이 차지하는 칸 수예요.',
    opts: ['1칸', '2칸', '3칸', '4칸'],
    ans: 2,
    ex: '"header header header"에서 header가 3번 반복됐으므로 <strong>3칸(전체 너비)</strong>을 차지해요. grid-area: header를 적용한 요소가 이 자리를 찾아가요.'
  },
  {
    cat: 'grid-template-areas',
    q: 'grid-template-areas에서 빈 칸을 나타내는 기호는?',
    code: `.container {\n  grid-template-areas:\n    <span class="val">". . a"</span>\n    <span class="val">". b c"</span>;\n}`,
    hint: '특수 문자 하나로 표현해요.',
    opts: ['빈 문자열 ""', '점 .', '언더바 _', '별표 *'],
    ans: 1,
    ex: '<strong>점(.)</strong>은 grid-template-areas에서 빈 칸을 의미해요. 아무 아이템도 배치되지 않는 빈 공간이에요.'
  },
  {
    cat: 'grid-template-areas',
    q: '반응형에서 grid-template-areas를 초기화하려면 어떻게 해야 하나요?',
    code: `<span class="cm">/* 모바일 */</span>\n@media (max-width: 768px) {\n  .container {\n    <span class="prop">grid-template-areas</span>:\n      <span class="val">"a" "b" "c"</span>;\n  }\n}`,
    hint: 'absolute를 static으로 바꾸는 것처럼 생각해보세요.',
    opts: [
      'grid-template-areas: none을 써야 한다',
      '미디어 쿼리에서 grid-template-areas를 다시 써주면 된다',
      '자식의 grid-area도 함께 바꿔야 한다',
      '반응형 변경이 불가능하다'
    ],
    ans: 1,
    ex: '미디어 쿼리 안에서 <strong>grid-template-areas를 다시 써주면</strong> 덮어써져요. 자식의 grid-area는 건드릴 필요 없고, 부모의 지도만 바꾸면 자식들이 새 지도대로 따라가요.'
  },
  {
    cat: 'grid-auto-flow',
    q: 'grid-auto-flow의 기본값은 무엇이며, 아이템이 어느 방향으로 흐르나요?',
    code: `.container {\n  grid-template-columns: repeat(3, 1fr);\n  <span class="cm">/* grid-auto-flow 기본값 */</span>\n}`,
    hint: 'Flexbox의 flex-direction과 비슷한 개념이에요.',
    opts: [
      'column — 위에서 아래로',
      'row — 왼쪽에서 오른쪽으로',
      'dense — 빈 칸을 채우며',
      'auto — 자동으로'
    ],
    ans: 1,
    ex: '<strong>grid-auto-flow: row</strong>가 기본값이에요. 왼쪽에서 오른쪽으로 채우고, 줄이 꽉 차면 다음 행으로 넘어가요.'
  },
  {
    cat: 'gap',
    q: '행 간격은 20px, 열 간격은 10px로 설정하려면?',
    code: `.container {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  <span class="prop">gap</span>: <span class="blank"></span>;\n}`,
    hint: 'gap: 행간격 열간격 순서로 두 값을 쓸 수 있어요.',
    opts: [
      'gap: 10px 20px',
      'gap: 20px 10px',
      'row-gap: 10px; column-gap: 20px',
      'gap: 20px / 10px'
    ],
    ans: 1,
    ex: '<strong>gap: 행간격 열간격</strong> 순서예요. gap: 20px 10px이면 행(위아래) 간격 20px, 열(좌우) 간격 10px이에요. 따로 쓰려면 row-gap: 20px; column-gap: 10px;으로 쓸 수 있어요.'
  },
  {
    cat: 'grid-auto-rows',
    q: 'grid-auto-rows: minmax(180px, auto)의 의미로 올바른 것은?',
    code: `.container {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  <span class="prop">grid-auto-rows</span>: <span class="val">minmax(180px, auto)</span>;\n}`,
    hint: 'grid-auto-rows는 명시하지 않은 행의 기본 크기를 정해요.',
    opts: [
      '행을 정확히 180px로 고정한다',
      '행 높이를 최소 180px로 하고, 내용이 많으면 늘어난다',
      '행을 최대 180px로 제한한다',
      '첫 번째 행만 180px로 설정한다'
    ],
    ans: 1,
    ex: '<strong>grid-auto-rows: minmax(180px, auto)</strong>는 자동 생성되는 행의 높이를 최소 180px로 설정하고, 내용이 많으면 auto로 늘어나도록 해요. grid-template-rows로 명시하지 않은 행에 적용돼요.'
  },
  {
    cat: 'Table vs Grid',
    q: 'HTML 테이블의 colspan과 CSS Grid의 grid-column 차이로 올바른 것은?',
    code: `<span class="cm">/* 테이블 */</span>\n&lt;td <span class="prop">colspan</span>="<span class="val">2</span>"&gt;합쳐진 셀&lt;/td&gt;\n\n<span class="cm">/* Grid */</span>\n.item { <span class="prop">grid-column</span>: <span class="val">1 / 3</span>; }`,
    hint: '테이블은 HTML 구조가 바뀌고, Grid는 CSS만 바뀌어요.',
    opts: [
      'colspan과 grid-column은 동일하게 동작한다',
      'colspan은 HTML 구조가 바뀌고, grid-column은 CSS만 변경하면 된다',
      'grid-column은 HTML 구조가 바뀌고, colspan은 CSS만 변경하면 된다',
      '둘 다 반응형 적용이 불가능하다'
    ],
    ans: 1,
    ex: '<strong>테이블 colspan</strong>은 HTML 구조 자체가 바뀌어서 반응형으로 레이아웃을 변경하려면 HTML을 다시 짜야 해요. 반면 <strong>CSS Grid</strong>는 HTML은 그대로 두고 CSS만 바꾸면 레이아웃이 완전히 달라져요. 그래서 레이아웃 목적으로는 테이블 대신 Grid를 써요.'
  }
];

let cur = 0;
let answered = new Array(Q.length).fill(null);
let sel = new Array(Q.length).fill(null);

function render() {
  const q = Q[cur];
  const prog = document.getElementById('prog');
  const qa   = document.getElementById('qa');

  // 진행률
  const pct = ((cur + 1) / Q.length) * 100;
  prog.style.width = pct + '%';

  // 문항
  let html = `
    <div class="q-meta">
      <span class="q-num">${cur + 1} / ${Q.length}</span>
      <span class="q-cat">${q.cat}</span>
    </div>
    <div class="q-text">${q.q.replace(/\n/g, '<br>')}</div>
  `;

  // 코드 블록
  if (q.code) {
    html += `<div class="code-block">${q.code}</div>`;
  }

  // 힌트
  html += `<div class="hint-box">💡 <strong>힌트</strong> — ${q.hint}</div>`;

  // 선택지
  html += `<div class="opts">`;
  const labels = ['A', 'B', 'C', 'D'];
  q.opts.forEach((opt, i) => {
    let cls = 'opt-btn';
    const done = answered[cur] !== null;
    if (done) {
      if (i === q.ans) cls += ' correct';
      else if (i === sel[cur] && sel[cur] !== q.ans) cls += ' wrong';
    }
    html += `
      <button class="${cls}" onclick="choose(${i})" ${done ? 'disabled' : ''}>
        <span class="opt-idx">${labels[i]}</span>
        ${opt}
      </button>`;
  });
  html += `</div>`;

  // 해설
  if (answered[cur] !== null) {
    html += `<div class="explanation">📝 <strong>해설</strong> — ${q.ex}</div>`;
  }

  // 네비게이션
  const isLast = cur === Q.length - 1;
  html += `
    <div class="nav">
      <button class="nav-btn" onclick="go(-1)" ${cur === 0 ? 'disabled' : ''}>← 이전</button>
      <span class="q-progress-text">${answered.filter(a => a !== null).length}/${Q.length} 완료</span>
      ${isLast
        ? `<button class="nav-btn primary" onclick="showScore()">결과 보기</button>`
        : `<button class="nav-btn primary" onclick="go(1)">다음 →</button>`
      }
    </div>
  `;

  qa.innerHTML = html;
}

function choose(i) {
  if (answered[cur] !== null) return;
  sel[cur] = i;
  answered[cur] = i === Q[cur].ans ? 'correct' : 'wrong';
  render();
}

function go(d) {
  cur = Math.max(0, Math.min(Q.length - 1, cur + d));
  render();
}

function showScore() {
  const correct = answered.filter(a => a === 'correct').length;
  const wrong   = answered.filter(a => a === 'wrong').length;
  const skip    = answered.filter(a => a === null).length;
  const pct     = Math.round((correct / Q.length) * 100);

  let emoji, title, msg;
  if (pct >= 90) {
    emoji = '🏆'; title = '완벽해요!';
    msg = 'CSS Grid 완전 정복! 실무에서 바로 써먹을 수 있어요.';
  } else if (pct >= 70) {
    emoji = '👏'; title = '잘했어요!';
    msg = '핵심 개념은 잘 이해했어요. 틀린 문제를 다시 한번 확인해보세요.';
  } else if (pct >= 50) {
    emoji = '💪'; title = '조금 더 힘내요!';
    msg = '기초는 잡혔어요. 헷갈리는 개념을 다시 복습해보세요.';
  } else {
    emoji = '📖'; title = '다시 도전!';
    msg = '오늘 배운 내용을 한 번 더 복습하고 다시 풀어보세요.';
  }

  document.getElementById('prog').style.width = '100%';
  document.getElementById('qa').innerHTML = `
    <div class="score-box">
      <div class="score-emoji">${emoji}</div>
      <div class="score-title">${title}</div>
      <div class="score-msg">${msg}</div>
      <div class="score-pct">${pct}점</div>
      <div class="score-grid">
        <div class="score-cell c">
          <div class="sc-num">${correct}</div>
          <div class="sc-label">정답</div>
        </div>
        <div class="score-cell w">
          <div class="sc-num">${wrong}</div>
          <div class="sc-label">오답</div>
        </div>
        <div class="score-cell s">
          <div class="sc-num">${skip}</div>
          <div class="sc-label">미응답</div>
        </div>
      </div>
      <button class="restart-btn" onclick="restart()">처음부터 다시 풀기</button>
    </div>
  `;
}

function restart() {
  cur = 0;
  answered = new Array(Q.length).fill(null);
  sel = new Array(Q.length).fill(null);
  render();
}

render();
</script>
</body>
</html>
