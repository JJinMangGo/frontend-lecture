<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="title desc">
<title id="title">간결성 법칙 비교 그림 B</title>
<desc id="desc">다섯 개의 원이 겹치는 위치에서 원의 윤곽선을 끊고, 교차 영역을 잎 모양의 독립된 조각으로 분리해 표현한 그림</desc>
<g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<!-- 위쪽 왼쪽 원: 오른쪽 아래 교차부를 비움 -->
<path d="M48 160 A92 92 0 1 1 202 92 A92 92 0 0 1 199 117"/>
<path d="M199 117 A92 92 0 0 1 197 122"/>
<!-- 위쪽 가운데 원: 양쪽 아래 교차부를 비움 -->
<path d="M239 113 A92 92 0 0 1 236 92 A92 92 0 1 1 390 160"/>
<!-- 위쪽 오른쪽 원: 왼쪽 아래 교차부를 비움 -->
<path d="M428 122 A92 92 0 0 1 426 92 A92 92 0 1 1 580 160"/>
<!-- 아래쪽 왼쪽 원: 위쪽 두 교차부를 비움 -->
<path d="M136 207 A92 92 0 0 0 136 230 A92 92 0 1 0 290 162"/>
<!-- 아래쪽 오른쪽 원: 위쪽 두 교차부를 비움 -->
<path d="M328 162 A92 92 0 1 0 482 230 A92 92 0 0 0 482 207"/>
<!-- 교차 영역을 독립적인 잎 모양으로 표현 -->
<path d="M199 117 C222 123 239 139 246 162 C224 158 207 143 199 117 Z"/>
<path d="M290 162 C283 139 266 123 239 113 C244 140 260 156 290 162 Z"/>
<path d="M390 160 C397 137 412 122 428 117 C426 142 412 157 390 160 Z"/>
<path d="M328 162 C335 139 351 123 390 113 C383 140 365 157 328 162 Z"/>
</g>
</svg>