<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 텍스트 & 컬러 퀴즈</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e3e;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e8e8f0;
      --text-muted: #7a7a9a;
      --correct: #3ecf8e;
      --wrong: #ff4d6d;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header {
      max-width: 720px;
      margin: 0 auto 48px;
      text-align: center;
    }

    header .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }

    header h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 300;
    }

    .quiz-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 20px;
      transition: border-color 0.3s;
    }

    .card.correct { border-color: var(--correct); }
    .card.wrong   { border-color: var(--wrong); }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .q-num {
      background: linear-gradient(135deg, var(--accent), #9b59b6);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .q-type {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 10px;
    }

    .q-text {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .q-text code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 7px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      color: #b0a8ff;
    }

    .preview-box {
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 9px;
      padding: 14px 18px;
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-box .demo { margin-top: 10px; }

    .gradient-demo {
      height: 48px;
      border-radius: 7px;
      background: linear-gradient(to right, #4f46e5 10%, #ec4899 50%);
    }

    /* 객관식 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      text-align: left;
      transition: all 0.2s;
      user-select: none;
      width: 100%;
    }

    .opt:hover:not(:disabled) { border-color: var(--accent); background: #1e1e2e; }
    .opt.correct  { border-color: var(--correct); background: rgba(62,207,142,0.1); color: var(--correct); }
    .opt.wrong    { border-color: var(--wrong);   background: rgba(255,77,109,0.1);  color: var(--wrong); }
    .opt:disabled { cursor: default; }

    .opt-key {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--border);
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .opt.correct .opt-key { background: var(--correct); color: #fff; }
    .opt.wrong   .opt-key { background: var(--wrong);   color: #fff; }

    /* 피드백 */
    .feedback {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.7;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.correct { background: rgba(62,207,142,0.1); border: 1px solid rgba(62,207,142,0.3); color: #5df0a8; }
    .feedback.wrong   { background: rgba(255,77,109,0.1);  border: 1px solid rgba(255,77,109,0.3);  color: #ff7a94; }

    .feedback strong { display: block; margin-bottom: 4px; }

    /* 결과 */
    #result-section {
      display: none;
      max-width: 720px;
      margin: 32px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 28px;
      text-align: center;
    }

    #result-section h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #score-text {
      font-size: 52px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    #result-msg {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 15px;
    }

    .retry-btn {
      margin-top: 28px;
      padding: 13px 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 99px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .retry-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<header>
  <div class="badge">CSS Practice Quiz</div>
  <h1>텍스트 & <span>컬러 퀴즈</span></h1>
  <p>text-align · text-transform · text-decoration · text-shadow · CSS Colors</p>
</header>

<div class="quiz-wrap" id="quiz"></div>

<div id="result-section">
  <h2>🎉 퀴즈 완료!</h2>
  <div id="score-text"></div>
  <p id="result-msg"></p>
  <button class="retry-btn" onclick="resetQuiz()">다시 풀기</button>
</div>

<script>
const quizData = [
  {
    q: `<code>text-align: justify</code> 속성의 기능으로 올바른 것은?`,
    options: ["텍스트를 오른쪽으로 정렬한다", "텍스트를 양쪽 끝에 맞게 균등하게 정렬한다", "텍스트를 가운데로 정렬한다", "텍스트를 왼쪽으로 정렬한다"],
    answer: 1,
    feedback: "justify는 텍스트를 양쪽 끝(left & right)에 모두 맞게 공백을 늘려 균등 배분합니다. 신문 기사 같은 레이아웃에 자주 사용됩니다."
  },
  {
    q: `<code>text-transform: capitalize</code> 속성을 "hello world"에 적용하면?`,
    options: ['"HELLO WORLD"', '"hello world"', '"Hello World"', '"Hello world"'],
    answer: 2,
    feedback: "capitalize는 각 단어의 첫 글자만 대문자로 변환합니다. uppercase는 전체 대문자, lowercase는 전체 소문자입니다."
  },
  {
    q: `링크에서 밑줄을 제거하려면 어떤 속성값을 사용해야 하나요?`,
    options: ["text-decoration: underline", "text-decoration: line-through", "text-decoration: none", "text-decoration: overline"],
    answer: 2,
    feedback: "<a> 태그는 기본적으로 underline이 적용됩니다. text-decoration: none 으로 제거할 수 있으며, :hover 상태에서 다시 underline을 주는 패턴을 자주 사용합니다."
  },
  {
    q: `<code>text-shadow: 2px 4px 6px rgba(0,0,0,0.5)</code> 에서 세 번째 값 <code>6px</code>은 무엇을 의미하나요?`,
    options: ["그림자의 수평 오프셋", "그림자의 수직 오프셋", "그림자의 흐림(blur) 반경", "그림자의 투명도"],
    answer: 2,
    feedback: "text-shadow의 순서는 수평오프셋 수직오프셋 blur-radius 색상 입니다. blur 값이 클수록 그림자가 더 넓게 퍼져 흐릿해집니다."
  },
  {
    q: `<code>text-align</code>이 적용되지 않는 상황은?`,
    options: ["블록 요소 안에 텍스트가 있을 때", "부모 요소가 텍스트보다 클 때", "요소의 너비가 텍스트 너비와 딱 맞을 때 (hug 상태)", "inline-block 요소에 width가 지정되었을 때"],
    answer: 2,
    feedback: "text-align은 텍스트를 감싼 컨테이너가 텍스트보다 클 때만 효과가 있습니다. 요소의 크기가 콘텐츠에 꼭 맞게 줄어든 경우(hug)에는 정렬할 여백이 없으므로 적용되지 않습니다."
  },
  {
    q: `버튼에 마우스를 올렸을 때만 배경색이 나타나게 하려고 합니다. 가장 적절한 방법은?`,
    options: ["button { background-color: blue; }", "button:hover { background-color: blue; }", "button { text-decoration: underline; }", "button:active { background-color: blue; }"],
    answer: 1,
    feedback: ":hover 는 마우스를 올렸을 때 적용되는 가상 클래스(pseudo-class)입니다. 수업 코드처럼 기본 상태에서는 alpha=0(투명)으로 두고 :hover에서 alpha=1로 바꾸는 패턴도 자주 씁니다."
  },
  {
    q: `<code>text-decoration: line-through</code> 는 텍스트를 어떻게 표시하나요?`,
    options: ["텍스트 아래에 밑줄을 표시한다", "텍스트 위에 윗줄을 표시한다", "텍스트 가운데를 가로지르는 취소선을 표시한다", "텍스트를 보이지 않게 숨긴다"],
    answer: 2,
    feedback: "line-through는 텍스트 중간을 가로지르는 취소선입니다. underline은 아래 밑줄, overline은 위 윗줄입니다. 쇼핑몰 할인 전 가격 표시 등에 자주 활용됩니다."
  },
  {
    q: `아래 그라디언트를 만드는 CSS는?\n(왼쪽: #4f46e5 → 오른쪽: #ec4899)`,
    preview: `<div class="gradient-demo"></div>`,
    options: ["background: radial-gradient(#4f46e5, #ec4899)", "background: linear-gradient(to right, #4f46e5, #ec4899)", "background: linear-gradient(to bottom, #4f46e5, #ec4899)", "background-color: linear-gradient(#4f46e5, #ec4899)"],
    answer: 1,
    feedback: "linear-gradient(to right, ...) 은 왼쪽에서 오른쪽 방향의 선형 그라디언트입니다. background-color가 아닌 background(또는 background-image)에 적용해야 합니다."
  },
  {
    q: `<code>rgba(0, 0, 0, 0)</code> 와 <code>rgba(0, 0, 0, 1)</code> 의 차이는?`,
    options: ["색상이 다르다 (흰색 vs 검정)", "알파값이 달라 전자는 완전 투명, 후자는 완전 불투명이다", "전자는 RGB, 후자는 RGBA 포맷이다", "차이가 없다"],
    answer: 1,
    feedback: "RGBA의 A(Alpha)는 0~1 사이 값으로 투명도를 제어합니다. 0은 완전 투명(보이지 않음), 1은 완전 불투명입니다. hover 효과에서 alpha 값만 바꾸는 방식을 자주 활용합니다."
  },
  {
    q: `<code>word-break: keep-all</code> 속성의 역할로 올바른 것은?`,
    options: ["모든 단어를 대문자로 변환한다", "긴 단어를 강제로 줄바꿈한다", "한글 단어 중간에서 줄바꿈되지 않도록 단어 단위로 줄바꿈한다", "텍스트가 줄바꿈되지 않도록 한 줄로 유지한다"],
    answer: 2,
    feedback: "word-break: keep-all 은 CJK(한중일) 텍스트에서 어절 단위로 줄바꿈을 허용합니다. 한글이 단어 중간에서 잘리는 것을 방지할 때 유용합니다."
  }
];

let answered = new Array(quizData.length).fill(false);
let score = 0;

function buildQuiz() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  answered = new Array(quizData.length).fill(false);
  score = 0;
  document.getElementById('result-section').style.display = 'none';

  quizData.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${qi}`;

    const previewHtml = item.preview
      ? `<div class="preview-box"><span>미리보기</span><div class="demo">${item.preview}</div></div>`
      : '';

    const optionsHtml = item.options.map((opt, oi) => `
      <button class="opt" onclick="selectAnswer(${qi}, ${oi})" id="opt-${qi}-${oi}">
        <span class="opt-key">${['A','B','C','D'][oi]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="q-meta">
        <div class="q-num">${qi + 1}</div>
        <span class="q-type">객관식</span>
      </div>
      <div class="q-text">${item.q.replace(/\n/g, '<br>')}</div>
      ${previewHtml}
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="fb-${qi}"></div>
    `;

    container.appendChild(card);
  });
}

function selectAnswer(qi, selected) {
  if (answered[qi]) return;
  answered[qi] = true;

  const item = quizData[qi];
  const isCorrect = selected === item.answer;
  if (isCorrect) score++;

  const card = document.getElementById(`card-${qi}`);
  card.classList.add(isCorrect ? 'correct' : 'wrong');

  item.options.forEach((_, oi) => {
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.disabled = true;
    if (oi === item.answer) btn.classList.add('correct');
    else if (oi === selected && !isCorrect) btn.classList.add('wrong');
  });

  const fb = document.getElementById(`fb-${qi}`);
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.innerHTML = `<strong>${isCorrect ? '✅ 정답입니다!' : '❌ 오답입니다.'}</strong>${item.feedback}`;

  if (answered.every(Boolean)) {
    setTimeout(showScore, 600);
  }
}

function showScore() {
  const rs = document.getElementById('result-section');
  rs.style.display = 'block';
  document.getElementById('score-text').textContent = `${score} / ${quizData.length}`;
  const msgs = [
    [10, '🏆 완벽해요! CSS 마스터!'],
    [8,  '🎯 훌륭합니다! 거의 다 맞혔어요.'],
    [6,  '👍 잘 하셨어요! 조금만 더 복습해봐요.'],
    [0,  '💪 한 번 더 도전해봐요!']
  ];
  document.getElementById('result-msg').textContent = msgs.find(([min]) => score >= min)[1];
  rs.scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
</body>
</html>
