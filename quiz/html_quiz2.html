    ex: "<html lang=\"ko\"> 형태로 최상위 루트 html 태그에 명시해 주어야 문서 전체 페이지의 기본 베이스 언어가 정상적으로 표준 브라우저에 등록됩니다."
  },
  {
    cat: "푸터 빈칸",
    q: "[주관식 빈칸] 푸터(Footer) 내부 영역에 회사의 공식 오프라인 주소, 대표전화 번호, 문의 메일 등 비즈니스 목적의 연락처 정보를 시맨틱하게 선언할 때 사용하는 전용 태그 명칭은?",
    code: null,
    opts: ["address", "contact", "section", "div"],
    ans: 0,
    ex: "<address> 태그는 단순 텍스트 정보가 아니라 해당 문서나 회사, 저자글의 실제 물리적/디지털 연락수단 경로 및 주소를 제공할 때 사용하는 표준 정의 태그입니다."
  },
  {
    cat: "코드 완성형",
    q: "[코드 구조 완성] 뉴스 목록 구역과 개별 기사 아이템 스트림을 시맨틱 규칙에 맞게 결합하려고 합니다. 아래 빈칸 (A)와 (B)에 배치할 레이아웃 태그의 짝으로 가장 완벽한 것은?",
    code: "<main>\n  <(A)>\n    <h2>오늘의 주요 뉴스</h2>\n    <(B)>\n      <h3>삼성전자 노조 결국 파업 강행하나</h3>\n      <p>본문 내용 요약 기사...</p>\n    </(B)>\n  </(A)>\n</main>",
    opts: ["(A): div / (B): span", "(A): section / (B): article", "(A): article / (B): aside", "(A): nav / (B): section"],
    ans: 1,
    ex: "연관된 뉴스 리스트를 묶어주는 거대한 구획 테마는 (A) <section>으로 지정하고, 그 안에 포함된 개별 뉴스 콘텐츠 유닛은 그 자체로 완결된 독립 정보이므로 (B) <article>로 감싸는 구조가 가장 이상적입니다."
  },
  {
    cat: "메타데이터 코드",
    q: "[코드 완성] 메신저 링크 공유 시 페이지 미리보기 이미지 카드를 예쁘게 출력하기 위해 사용되는 Open Graph 메타 태그의 빈칸 속성 프로퍼티 이름은 무엇인가요?",
    code: "<head>\n  <meta property=\"og:title\" content=\"시맨틱 마크업의 가치\">\n  <meta property=\"[ 빈칸 ]\" content=\"./assets/img/preview.png\">\n</head>",
    opts: ["og:image", "og:url", "og:description", "og:type"],
    ans: 0,
    ex: "공유 미리보기 카드에 띄울 대표 이미지 소스 경로는 <meta property=\"og:image\" ...> 속성명을 명시해 주어야 플랫폼 로봇이 이를 수집해 카드 UI로 가공합니다."
  },
  {
    cat: "웹 접근성 CSS",
    q: "[실무 코드 완성] 시맨틱 구조 상으로 제목(h2)을 반드시 제공하되, 디자인 가이드라인 때문에 화면 레이아웃에서는 감추고 오직 시각장애인용 스크린 리더 기기만 인식하게 처리할 때 사용하는 실무 표준 클래스 관례명은?",
    code: "<nav aria-label=\"주요 네비게이션\">\n  <h2 class=\"[ 빈칸 ]\">메인 카테고리 메뉴</h2>\n  <ul>\n    <li><a href=\"#\">정치</a></li>\n  </ul>\n</nav>",
    opts: ["hidden", "sr-only", "display-none", "invisible"],
    ans: 1,
    ex: "sr-only (Screen Reader Only) 또는 visually-hidden 클래스는 실무 웹 퍼블리싱에서 눈에는 보이지 않으나 HTML 구조의 시맨틱과 아웃라인을 지키며 접근성을 백퍼센트 달성하기 위해 필수로 쓰이는 기법 명칭 관례입니다."
  }
];

// 글로벌 퀴즈 상태 제어 변수
var cur = 0;
var answered = new Array(Q.length).fill(null);
var sel = new Array(Q.length).fill(null);

function setText(el, text) {
  el.textContent = text;
}

function render() {
  var el = document.getElementById('qa');
  if (!el) return;
  
  // 기존 하위 노드 초기화
  while (el.firstChild) el.removeChild(el.firstChild);

  // 퀴즈 종료 시 결과 화면 렌더링
  if (cur >= Q.length) { renderScore(el); return; }

  var q = Q[cur];
  var done = answered[cur] !== null;
  var pct = Math.round((cur / Q.length) * 100);

  // 1. 프로그레스 바 영역
  var progBg = document.createElement('div');
  progBg.className = 'prog-bg';
  var progFill = document.createElement('div');
  progFill.className = 'prog-fill';
  progFill.style.width = pct + '%';
  progBg.appendChild(progFill);
  el.appendChild(progBg);

  // 2. 메타 정보 영역 (문항 번호 & 카테고리 태그)
  var meta = document.createElement('div');
  meta.className = 'q-meta';
  var num = document.createElement('span');
  num.className = 'q-num';
  setText(num, '문제 ' + (cur + 1) + ' / ' + Q.length);
  var cat = document.createElement('span');
  cat.className = 'q-cat';
  setText(cat, q.cat);
  meta.appendChild(num);
  meta.appendChild(cat);
  el.appendChild(meta);

  // 3. 질문 텍스트 영역
  var qText = document.createElement('div');
  qText.className = 'q-text';
  setText(qText, q.q);
  el.appendChild(qText);

  // 4. 소스코드 가독 영역 (code 데이터가 있을 때만 활성화)
  if (q.code) {
    var codeEl = document.createElement('pre');
    codeEl.className = 'q-code';
    setText(codeEl, q.code);
    el.appendChild(codeEl);
  }

  // 5. 보기 버튼 리스트 생성 구역
  var opts = document.createElement('div');
  opts.className = 'options';
  q.opts.forEach(function(o, i) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    
    // 유저가 이미 정답을 체크한 문항인 경우 스타일 픽스 및 버튼 잠금
    if (done) {
      if (i === q.ans) btn.classList.add('correct');
      else if (i === sel[cur] && i !== q.ans) btn.classList.add('wrong');
      btn.disabled = true;
    }
    
    setText(btn, (i + 1) + ') ' + o);
    btn.addEventListener('click', function() { choose(i); });
    opts.appendChild(btn);
  });
  el.appendChild(opts);

  // 6. 상세 해설 박스 노출 구역 (정답 확인 후 활성화)
  if (done) {
    var exp = document.createElement('div');
    exp.className = 'explanation';
    var bold = document.createElement('strong');
    setText(bold, '💡 퍼블리싱 매뉴얼 가이드: ');
    exp.appendChild(bold);
    exp.appendChild(document.createTextNode(q.ex));
    el.appendChild(exp);
  }

  // 7. 하단 네비게이션 제어 바 구역
  var nav = document.createElement('div');
  nav.className = 'nav-row';

  var prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn';
  setText(prevBtn, '← 이전 문제');
  if (cur === 0) prevBtn.disabled = true;
  prevBtn.addEventListener('click', function() { go(-1); });

  var countSpan = document.createElement('span');
  countSpan.className = 'nav-count';
  var doneCount = answered.filter(function(a){ return a !== null; }).length;
  setText(countSpan, doneCount + ' / ' + Q.length + ' 풀이 완료');

  var nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn primary';
  if (cur < Q.length - 1) {
    setText(nextBtn, '다음 문제 →');
    nextBtn.addEventListener('click', function() { go(1); });
  } else {
    setText(nextBtn, '최종 결과 확인');
    nextBtn.addEventListener('click', function() { cur = Q.length; render(); });
  }

  nav.appendChild(prevBtn);
  nav.appendChild(countSpan);
  nav.appendChild(nextBtn);
  el.appendChild(nav);
}

function choose(i) {
  if (answered[cur] !== null) return;
  sel[cur] = i;
  answered[cur] = i === Q[cur].ans ? 'correct' : 'wrong';
  render();
}

function go(d) {
  cur = Math.max(0, Math.min(Q.length - 1, cur + d));
  render();
}

function renderScore(el) {
  var c = answered.filter(function(a){ return a === 'correct'; }).length;
  var w = answered.filter(function(a){ return a === 'wrong'; }).length;
  var sk = answered.filter(function(a){ return a === null; }).length;
  var pct = Math.round((c / Q.length) * 100);
  
  var msg = pct >= 95 ? '🥇 대단합니다! 현업 최고 수준의 시맨틱 마크업 설계 역량을 갖추셨습니다.' :
            pct >= 80 ? '🥈 훌륭합니다! 웹 표준 마크업의 가이드라인을 깊이 이해하고 계시네요.' :
            pct >= 60 ? '🥉 안정적인 기초 체력을 보유하셨습니다. 해설을 통해 디테일을 조금만 더 다듬어보세요!' :
            '🌱 마크업 가이드라인을 차근차근 다시 읽어보며 시맨틱 요소의 의미를 정립해 보길 권장합니다.';

  var box = document.createElement('div');
  box.className = 'score-box';

  var scoreNum = document.createElement('div');
  scoreNum.className = 'score-num';
  setText(scoreNum, pct + '점');

  var scoreLabel = document.createElement('div');
  scoreLabel.className = 'score-label';
  setText(scoreLabel, msg);

  var grid = document.createElement('div');
  grid.className = 'score-grid';

  [[c, '#3B6D11', '정답 유닛'], [w, '#A32D2D', '오답 유닛'], [sk, '#64748b', '미응답']].forEach(function(item) {
    var card = document.createElement('div');
    card.className = 'score-card';
    var val = document.createElement('div');
    val.className = 'sc-val';
    val.style.color = item[1];
    setText(val, item[0]);
    var lbl = document.createElement('div');
    lbl.className = 'sc-label';
    setText(lbl, item[2]);
    card.appendChild(val);
    card.appendChild(lbl);
    grid.appendChild(card);
  });

  var restartBtn = document.createElement('button');
  restartBtn.className = 'nav-btn primary';
  setText(restartBtn, '🔄 처음부터 다시 도전하기');
  restartBtn.addEventListener('click', function() {
    cur = 0;
    answered = new Array(Q.length).fill(null);
    sel = new Array(Q.length).fill(null);
    render();
  });

  box.appendChild(scoreNum);
  box.appendChild(scoreLabel);
  box.appendChild(grid);
  box.appendChild(restartBtn);
  el.appendChild(box);
}

// 돔 로드 완료 시 애플리케이션 초기 기동
render();
</script>
</body>
</html>
