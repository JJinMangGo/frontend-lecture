<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 기초 퀴즈 20문제</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans Kr", sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .card { background: #ffffff; border-radius: 16px; border: 1px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 680px; }
  .prog-bg { background: #ebebeb; border-radius: 99px; height: 6px; margin-bottom: 1.5rem; }
  .prog-fill { height: 6px; border-radius: 99px; background: #534AB7; transition: width .3s; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .q-num { font-size: 13px; color: #888; }
  .q-cat { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: #EEEDFE; color: #3C3489; }
  .q-text { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.6; }
  .q-code { background: #f5f5f0; border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 13px; margin-bottom: 1.25rem; white-space: pre; overflow-x: auto; color: #1a1a1a; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
  .opt-btn { text-align: left; background: #fff; border: 1px solid #ccc; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-family: 'Courier New', monospace; color: #1a1a1a; cursor: pointer; line-height: 1.5; transition: border-color .15s, background .15s; }
  .opt-btn:hover:not(:disabled) { border-color: #534AB7; background: #EEEDFE; color: #3C3489; }
  .opt-btn.correct { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
  .opt-btn.wrong { background: #FCEBEB; border-color: #A32D2D; color: #501313; }
  .opt-btn:disabled { cursor: default; }
  .explanation { background: #f5f5f0; border-left: 3px solid #534AB7; border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .nav-btn { padding: 8px 22px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-size: 14px; cursor: pointer; font-family: inherit; transition: background .15s; }
  .nav-btn:hover:not(:disabled) { background: #f5f5f0; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.primary { background: #534pAB7; color: #fff; border-color: #534AB7; }
  .nav-btn.primary:hover { background: #3C3489; }
  .nav-count { font-size: 13px; color: #888; }
  .score-box { text-align: center; padding: 2rem 1rem; }
  .score-num { font-size: 52px; font-weight: 500; color: #534AB7; }
  .score-label { font-size: 16px; color: #555; margin-bottom: 1.5rem; margin-top: .25rem; }
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .score-card { background: #f5f5f0; border-radius: 10px; padding: 14px; }
  .sc-val { font-size: 22px; font-weight: 500; }
  .sc-label { font-size: 12px; color: #888; margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div id="qa"></div>
</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const Q=[
  {cat:'기본 구조',q:'HTML 문서의 올바른 기본 구조로 가장 적절한 것은?',code:null,
   opts:['<head> → <html> → <body>','<!DOCTYPE html> → <html> → <head> + <body>','<body> → <head> → <html>','<!DOCTYPE html> → <body> → <head>'],
   ans:1,ex:'HTML 문서는 반드시 <!DOCTYPE html> 선언으로 시작하고, <html> 태그 안에 <head>와 <body>가 순서대로 위치해야 합니다.'},
  {cat:'DOCTYPE',q:'<!DOCTYPE html> 선언의 역할로 올바른 것은?',code:null,
   opts:['HTML 문서의 제목을 지정한다','브라우저에게 HTML5 문서임을 알린다','CSS 파일을 불러온다','자바스크립트를 활성화한다'],
   ans:1,ex:'<!DOCTYPE html>은 브라우저가 표준 모드(Standards Mode)로 문서를 렌더링하도록 알려주는 선언입니다.'},
  {cat:'헤드 요소',q:'<head> 태그 안에 들어가지 않는 것은?',code:null,
   opts:['<title>','<meta>','<link>','<p>'],
   ans:3,ex:'<p>는 문단 태그로 <body> 안에 위치합니다. <head>에는 <title>, <meta>, <link>, <script>, <style> 등이 들어갑니다.'},
  {cat:'시맨틱 태그',q:'HTML5에서 새로 도입된 시맨틱 태그가 아닌 것은?',code:null,
   opts:['<header>','<article>','<div>','<section>'],
   ans:2,ex:'<div>는 HTML5 이전부터 있던 비시맨틱(non-semantic) 태그입니다. <header>, <article>, <section> 등은 HTML5 시맨틱 태그입니다.'},
  {cat:'텍스트 태그',q:'제목 태그 중 가장 중요도가 높은(글자가 가장 큰) 태그는?',code:null,
   opts:['<h6>','<h3>','<h1>','<title>'],
   ans:2,ex:'<h1>이 가장 중요도가 높은 제목 태그이며, <h6>로 갈수록 중요도가 낮아집니다.'},
  {cat:'링크',q:'아래 링크가 새 탭에서 열리도록 추가해야 할 속성은?',code:'<a href="https://example.com">방문하기</a>',
   opts:['rel="new"','target="_blank"','open="tab"','window="new"'],
   ans:1,ex:'target="_blank" 속성을 추가하면 새 탭에서 열립니다. 보안을 위해 rel="noopener noreferrer"도 함께 쓰는 것이 권장됩니다.'},
  {cat:'이미지',q:'<img> 태그에서 반드시 포함해야 할 필수 속성 두 가지는?',code:null,
   opts:['src, width','src, alt','href, alt','url, title'],
   ans:1,ex:'src는 이미지 경로, alt는 대체 텍스트를 지정합니다. alt는 접근성과 SEO에서 매우 중요합니다.'},
  {cat:'목록',q:'순서가 없는 목록(불릿 포인트)을 만들 때 사용하는 태그는?',code:null,
   opts:['<ol>','<dl>','<ul>','<list>'],
   ans:2,ex:'<ul>(Unordered List)은 순서 없는 목록, <ol>(Ordered List)은 순서 있는 목록을 만듭니다. 각 항목은 <li> 태그로 감쌉니다.'},
  {cat:'폼',q:'아래 input이 비밀번호를 입력받도록 하려면 type 값으로 무엇을 써야 하나?',code:'<input type="???" name="pw">',
   opts:['hidden','password','secret','text'],
   ans:1,ex:'type="password"로 설정하면 입력 내용이 •••로 가려집니다. text, email, number, checkbox, radio, submit 등도 자주 쓰입니다.'},
  {cat:'폼',q:'<form> 태그의 method 속성으로 사용할 수 있는 값은?',code:null,
   opts:['send, receive','get, post','fetch, push','input, output'],
   ans:1,ex:'method="get"은 URL에 데이터를 붙여 전송하고, method="post"는 요청 본문에 담아 전송합니다. 민감한 정보에는 post를 사용합니다.'},
  {cat:'테이블',q:'표(table)에서 헤더 셀을 나타내는 태그는?',code:null,
   opts:['<td>','<tr>','<th>','<thead>'],
   ans:2,ex:'<th>는 테이블 헤더 셀로 기본적으로 굵고 가운데 정렬됩니다. <td>는 일반 데이터 셀, <tr>은 행(row)입니다.'},
  {cat:'속성',q:'HTML 요소에서 페이지 내 고유한 식별자를 지정하는 속성은?',code:null,
   opts:['class','name','id','key'],
   ans:2,ex:'id는 한 페이지에서 고유해야 하는 식별자입니다. CSS에서는 #id로 선택합니다. class는 여러 요소에 동일하게 사용 가능합니다.'},
  {cat:'블록 vs 인라인',q:'기본적으로 인라인(inline) 요소에 해당하는 것은?',code:null,
   opts:['<div>','<p>','<span>','<section>'],
   ans:2,ex:'<span>은 대표적인 인라인 요소로 줄바꿈 없이 텍스트 흐름 안에 위치합니다. <div>, <p>, <section>은 블록 요소입니다.'},
  {cat:'메타 태그',q:'반응형 웹을 위해 모바일 뷰포트를 설정하는 올바른 meta 태그는?',code:null,
   opts:['<meta name="viewport" content="width=device-width, initial-scale=1">','<meta name="mobile" content="responsive">','<meta type="viewport" value="mobile">','<meta charset="mobile">'],
   ans:0,ex:'viewport meta 태그는 모바일 브라우저가 화면 너비를 기기 너비에 맞추고 초기 배율을 1로 설정하도록 합니다.'},
  {cat:'문자 인코딩',q:'한글이 깨지지 않도록 문자 인코딩을 지정하는 태그는?',code:null,
   opts:['<meta charset="UTF-8">','<meta lang="ko">','<encode type="UTF-8">','<html charset="UTF-8">'],
   ans:0,ex:'<meta charset="UTF-8">은 문서의 문자 인코딩을 UTF-8로 지정합니다. UTF-8은 한글을 포함한 거의 모든 언어를 표현할 수 있습니다.'},
  {cat:'시맨틱 태그',q:'페이지 내 주요 내비게이션 링크 모음을 감싸기에 가장 적합한 태그는?',code:null,
   opts:['<header>','<nav>','<aside>','<menu>'],
   ans:1,ex:'<nav>는 주요 내비게이션 링크 그룹을 감싸는 시맨틱 태그입니다. <header>는 머리말, <aside>는 사이드바에 사용합니다.'},
  {cat:'이스케이프',q:'HTML 문서에서 < 기호를 화면에 표시하려면 어떻게 써야 하나?',code:null,
   opts:['\\<','&lt;','#lt;','<escape>'],
   ans:1,ex:'HTML 특수문자는 엔티티(entity)로 표현합니다. < → &lt;, > → &gt;, & → &amp;, 공백 → &nbsp; 등이 자주 쓰입니다.'},
  {cat:'링크',q:'같은 페이지 내 id="top" 위치로 이동하는 앵커 링크로 올바른 것은?',code:null,
   opts:['<a href="page#top">','<a href="#top">','<a link="top">','<a goto="top">'],
   ans:1,ex:'# 기호 뒤에 id 값을 적으면 같은 페이지의 해당 요소로 스크롤됩니다. 이를 앵커 링크(anchor link)라고 합니다.'},
  {cat:'멀티미디어',q:'<video> 태그에서 영상이 자동으로 반복 재생되게 하려면?',code:null,
   opts:['repeat="true" 추가','autoplay와 loop 속성 추가','play="loop" 추가','controls="auto" 추가'],
   ans:1,ex:'autoplay는 자동 재생, loop는 반복 재생 속성입니다. autoplay는 브라우저 정책상 muted와 함께 써야 작동하는 경우가 많습니다.'},
  {cat:'접근성',q:'스크린리더 사용자를 위해 이미지 대체 텍스트를 제공하는 올바른 방법은?',code:'<img src="logo.png" ???>',
   opts:['title="로고 이미지"','alt="회사 로고"','desc="회사 로고"','label="로고 이미지"'],
   ans:1,ex:'alt 속성은 이미지를 볼 수 없는 상황에서 대체 텍스트를 제공합니다. 장식용 이미지는 alt=""로 비워두는 것이 권장됩니다.'}
];

let cur=0, answered=new Array(Q.length).fill(null), sel=new Array(Q.length).fill(null);

function render(){
  const el=document.getElementById('qa');
  if(cur>=Q.length){renderScore(el);return;}
  const q=Q[cur];
  const pct=Math.round(cur/Q.length*100);
  const done=answered[cur]!==null;
  const s=sel[cur];
  let optsHTML=q.opts.map((o,i)=>{
    let cls='opt-btn';
    if(done){if(i===q.ans)cls+=' correct';else if(i===s&&i!==q.ans)cls+=' wrong';}
    return `<button class="${cls}" ${done?'disabled':''} onclick="choose(${i})">${esc(o)}</button>`;
  }).join('');
  el.innerHTML=`
    <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="q-meta"><span class="q-num">${cur+1} / ${Q.length}</span><span class="q-cat">${esc(q.cat)}</span></div>
    <div class="q-text">${esc(q.q)}</div>
    ${q.code?`<div class="q-code">${esc(q.code)}</div>`:''}
    <div class="options">${optsHTML}</div>
    ${done?`<div class="explanation"><strong>해설:</strong> ${esc(q.ex)}</div>`:''}
    <div class="nav-row">
      <button class="nav-btn" onclick="go(-1)" ${cur===0?'disabled':''}>← 이전</button>
      <span class="nav-count">${answered.filter(a=>a!==null).length}문제 완료</span>
      ${cur<Q.length-1
        ?`<button class="nav-btn primary" onclick="go(1)">다음 →</button>`
        :`<button class="nav-btn primary" onclick="cur=Q.length;render()">결과 보기</button>`}
    </div>`;
}

function choose(i){
  if(answered[cur]!==null)return;
  sel[cur]=i; answered[cur]=i===Q[cur].ans?'correct':'wrong';
  render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}

function renderScore(el){
  const c=answered.filter(a=>a==='correct').length;
  const w=answered.filter(a=>a==='wrong').length;
  const sk=answered.filter(a=>a===null).length;
  const pct=Math.round(c/Q.length*100);
  const msg=pct>=90?'완벽해요! HTML 마스터':pct>=70?'잘 하고 있어요! 조금만 더 연습하면 완벽해요.':pct>=50?'기초는 잡혔어요! 틀린 부분을 복습해 보세요.':'기초부터 차근차근 다시 학습해 보세요.';
  el.innerHTML=`<div class="score-box">
    <div class="score-num">${pct}점</div>
    <div class="score-label">${msg}</div>
    <div class="score-grid">
      <div class="score-card"><div class="sc-val" style="color:#3B6D11">${c}</div><div class="sc-label">정답</div></div>
      <div class="score-card"><div class="sc-val" style="color:#A32D2D">${w}</div><div class="sc-label">오답</div></div>
      <div class="score-card"><div class="sc-val" style="color:#888">${sk}</div><div class="sc-label">미응답</div></div>
    </div>
    <button class="nav-btn primary" onclick="cur=0;answered=new Array(Q.length).fill(null);sel=new Array(Q.length).fill(null);render()">처음부터 다시 풀기</button>
  </div>`;
}
render();
</script>
</body>
</html>
