<!doctype html>
<!-- 최소 동작 스캐폴드. 레이어 순서 · SVG 렌즈 defs · 포인터 광원 배선만 담았다.
     타이포/컬러/카피/레이아웃은 프로젝트에 맞게 전부 교체한다.
     로컬 file:// 이 아니라 HTTP 로 서빙해야 feImage 가 맵을 읽는다. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glass surface</title>
    <link rel="stylesheet" href="liquid-glass.css" />
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; gap: 28px;
             font: 400 16px/1.5 system-ui, sans-serif; color: #fff; }
      .panel { width: 420px; height: 220px; }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 0; opacity: 0.72; }
    </style>
  </head>
  <body class="lg-stage">
    <!-- 렌즈 필터. width/height 는 표면의 실제 CSS 픽셀 크기와 일치해야 한다.
         맵 생성: python gen_glass_maps.py --width 420 --height 220 --radius 28 --bezel 26 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="lg-lens" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feImage href="glass/displacement-420x220.png" x="0" y="0" width="420" height="220" result="map" />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="34"
            xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <!-- 굴절 유리: 페이지 배경(--lg-bg)을 클론해 휘게 만든다 -->
    <article class="lg lg--lens lg--interactive panel" data-glass tabindex="0">
      <div class="lg__backdrop"></div>
      <div class="lg__sheen"></div>
      <div class="lg__content">
        <h1>Lens</h1>
        <p>배경을 실제로 굴절시키는 판. 가장자리 최대, 중앙 0.</p>
      </div>
    </article>

    <!-- 프로스트 유리: 배경을 모를 때 / 스크롤 콘텐츠 위 -->
    <article class="lg lg--frost lg--interactive panel" data-glass tabindex="0">
      <div class="lg__backdrop"></div>
      <div class="lg__sheen"></div>
      <div class="lg__content">
        <h1>Frost</h1>
        <p>모든 브라우저에서 동작하는 기준 표면.</p>
      </div>
    </article>

    <script>
      // 렌즈 모드 배경 정합: 요소의 화면 좌표를 CSS 변수로 넘긴다.
      const lenses = [...document.querySelectorAll('.lg--lens')];
      let syncRaf = 0;
      function syncLenses() {
        if (syncRaf) return;
        syncRaf = requestAnimationFrame(() => {
          for (const el of lenses) {
            const r = el.getBoundingClientRect();
            el.style.setProperty('--lg-x', r.left + 'px');
            el.style.setProperty('--lg-y', r.top + 'px');
          }
          syncRaf = 0;
        });
      }
      syncLenses();
      addEventListener('scroll', syncLenses, { passive: true });
      addEventListener('resize', syncLenses);

      // 포인터를 따라 스펙큘러 광원 이동. 프레임당 1회만 쓴다.
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      for (const el of document.querySelectorAll('[data-glass]')) {
        let raf = 0, mx = 28, my = 0;
        el.addEventListener('pointermove', (e) => {
          if (reduce) return;
          const r = el.getBoundingClientRect();
          mx = ((e.clientX - r.left) / r.width) * 100;
          my = ((e.clientY - r.top) / r.height) * 100;
          if (!raf) raf = requestAnimationFrame(() => {
            el.style.setProperty('--lg-mx', mx + '%');
            el.style.setProperty('--lg-my', my + '%');
            raf = 0;
          });
        });
        el.addEventListener('pointerleave', () => {
          el.style.setProperty('--lg-mx', '28%');
          el.style.setProperty('--lg-my', '0%');
        });
      }
    </script>
  </body>
</html>
