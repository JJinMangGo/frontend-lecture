 <style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-light: #eef2ff;
    --text: #1e293b;
    --sub: #94a3b8;
    --correct-bg: #f0fdf4;
    --correct-bd: #16a34a;
    --wrong-bg: #fef2f2;
    --wrong-bd: #dc2626;
    --cat-bg: #eef2ff;
    --cat-txt: #3730a3;
    --code-bg: #1e1e2e;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    color: var(--text);
  }
  .wrap { width: 100%; max-width: 700px; }
  .prog-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 99px; margin-bottom: 28px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.4s ease; }
  .card { background: var(--card); border-radius: 16px; padding: 32px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); }
  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .q-num { color: var(--sub); font-size: 13px; }
  .q-cat { background: var(--cat-bg); color: var(--cat-txt); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .q-text { font-size: 17px; font-weight: 700; line-height: 1.6; margin-bottom: 20px; }
  .hint-box { background: #f8faff; border-left: 4px solid var(--primary); border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 13px; color: #334155; margin-bottom: 18px; line-height: 1.6; }
  .code-block { background: var(--code-bg); border-radius: 10px; padding: 16px 20px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #cdd6f4; margin-bottom: 18px; line-height: 1.7; overflow-x: auto; white-space: pre; }
  .code-block .kw { color: #89b4fa; }
  .code-block .val { color: #fab387; }
  .code-block .sel { color: #cba6f7; }
  .code-block .cm { color: #585b7a; }
  .code-block .blank { display: inline-block; background: #45475a; border-bottom: 2px solid #89b4fa; min-width: 100px; height: 18px; border-radius: 3px; vertical-align: middle; }
  .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .opt-btn { width: 100%; text-align: left; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; line-height: 1.5; }
  .opt-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
  .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-bd); color: #15803d; font-weight: 700; }
  .opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-bd); color: #dc2626; }
  .opt-btn:disabled { cursor: default; }
  .explanation { background: #f8faff; border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #334155; line-height: 1.7; margin-bottom: 20px; border: 1px solid #e2e8f0; }
  .explanation strong { color: var(--primary); }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .nav-btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.ghost { background: #e2e8f0; color: var(--text); }
  .result-btn { background: #0f172a; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; cursor: pointer; }
  .score-box { text-align: center; }
  .score-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .score-pct { font-size: 52px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .score-msg { color: var(--sub); font-size: 14px; margin-bottom: 28px; }
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .score-cell { background: var(--bg); border-radius: 12px; padding: 16px 8px; }
  .score-cell .sc-num { font-size: 26px; font-weight: 700; }
  .score-cell .sc-lbl { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .score-cell.c .sc-num { color: var(--correct-bd); }
  .score-cell.w .sc-num { color: var(--wrong-bd); }
  .score-cell.s .sc-num { color: var(--sub); }
  .retry-btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="prog-bg"><div class="prog-fill" id="prog"></div></div>
  <div class="card" id="qa"></div>

<script>
const Q = [
  // ── 개념 이해 ──
  {
    cat: '개념 이해',
    q: 'display: flex를 부모 요소에 적용하면 어떤 일이 일어나나요?',
    code: null,
    hint: 'flex는 부모에 선언하고 자식들을 정렬합니다.',
    opts: [
      '부모 요소 자체가 화면 중앙으로 이동한다',
      '해당 요소가 flex 컨테이너가 되어 내부 자식 요소(flex 아이템)들을 정렬할 수 있게 된다',
      '자식 요소들이 자동으로 같은 크기가 된다',
      '자식 요소들에 자동으로 position: absolute가 적용된다'

    ans: 1,

  },
  {
    cat: '개념 이해',

  {

    opts: [

    ],
    ans: 1,
    ex: '<strong>flex-shrink: 1</strong>이 기본값입니다. 부모 공간이 부족할 때 자식들이 기본적으로 줄어들게 설계되어 있습니다. <strong>0</strong>으로 바꾸면 부모가 좁아져도 자신의 크기를 유지합니다.'
  },
  {

    q: 'flex-wrap의 기본값과 wrap 값의 차이는?',
    code: null,
    hint: '피그마 오토레이아웃의 wrap 기능과 매핑됩니다.',
    opts: [

      'nowrap(기본) — 공간 부족해도 한 줄 유지, 자식 크기 강제 축소 / wrap — 공간 부족 시 다음 줄로 내려감',
      '둘 다 동일하게 동작하며 차이 없음',

    ans: 1,

  {
    cat: '빈칸 채우기',
    q: 'SBS 골프 카드 리스트에서 4개의 li가 부모 여백을 균등하게 나눠 채우도록 합니다. 빈칸을 채우세요.',

  {
    cat: '빈칸 채우기',
    q: '자식 요소들을 가로로 나열하고 양끝에 붙이되 사이 여백을 균등하게 배분하려 합니다.',

  <span class="kw">display</span>: <span class="val">flex</span>;
  <span class="kw">justify-content</span>: <span class="blank"></span>;

    ],
    ans: 1,
    ex: '<strong>flex-direction: column</strong>이면 메인축이 세로입니다. <strong>align-items</strong>는 교차축(가로) 기준이므로 center를 주면 자식들이 가로 가운데로 정렬됩니다. 자식들은 세로로 쌓이면서 가로 기준 중앙에 배치됩니다.'
  },
  {
    cat: '코드 결과 예측',
    q: '두 자식이 있을 때 아래 코드를 적용하면 공간 배분이 어떻게 되나요?',
    code: `<span class="sel">.item-a</span> { <span class="kw">flex-grow</span>: <span class="val">1</span>; }
<span class="sel">.item-b</span> { <span class="kw">flex-grow</span>: <span class="val">2</span>; }`,
    hint: 'grow 값의 비율로 남은 공간을 나눕니다.',
    opts: [
      'item-a와 item-b가 동일한 크기',
      'item-a가 남은 공간의 1/3, item-b가 2/3를 차지',
      'item-b만 늘어나고 item-a는 고정',
      'item-a가 2/3, item-b가 1/3을 차지'
    ],
    ans: 1,
    ex: '<strong>flex-grow</strong> 값의 합(1+2=3)을 기준으로 남은 공간을 비율로 나눕니다. item-a는 1/3, item-b는 2/3를 가져갑니다. 두 값이 모두 1이면 1:1로 균등하게 나눕니다.'
  },
  {
    cat: '코드 결과 예측',
    q: 'flex-shrink: 0을 자식에 적용하면 어떻게 되나요?',
    code: `<span class="sel">.item</span> {
  <span class="kw">width</span>: <span class="val">200px</span>;
  <span class="kw">flex-shrink</span>: <span class="val">0</span>;
}`,
    hint: 'shrink 0은 줄어들지 않겠다는 의미입니다.',
    opts: [
      '부모가 200px보다 좁아지면 자동으로 줄어든다',
      '부모가 좁아져도 200px 고정 크기를 유지한다',
      '요소가 사라진다',
      'flex-grow: 1과 같은 효과'
    ],
    ans: 1,
    ex: '<strong>flex-shrink: 0</strong>은 부모 공간이 부족해도 해당 아이템이 줄어들지 않고 지정한 크기(200px)를 유지합니다. 로고, 아이콘처럼 크기가 고정되어야 하는 요소에 사용합니다.'
  },
  {
    cat: '코드 결과 예측',
    q: 'align-content가 작동하기 위한 조건은 무엇인가요?',
    code: `<span class="sel">.container</span> {
  <span class="kw">display</span>: <span class="val">flex</span>;
  <span class="kw">flex-wrap</span>: <span class="val">wrap</span>;
  <span class="kw">align-content</span>: <span class="val">space-between</span>;
}`,
    hint: 'align-content는 한 줄일 때 반응이 없습니다.',
    opts: [
      'flex-direction: column이 있어야 함',
      'align-items가 없어야 함',
      'flex-wrap: wrap 상태이고 자식들이 두 줄 이상일 때만 작동',
      '항상 작동하며 조건 없음'
    ],
    ans: 2,
    ex: '<strong>align-content</strong>는 <strong>flex-wrap: wrap</strong> 상태에서 자식들이 두 줄 이상(다중행)으로 배치되었을 때만 작동합니다. 한 줄일 때는 반응이 없으며, 여러 줄 전체 덩어리를 교차축 기준으로 배분합니다.'
  },

  // ── 오류 찾기 ──
  {
    cat: '오류 찾기',
    q: '자식 li들을 가로로 균등하게 나누려 했는데 의도대로 되지 않습니다. 문제는?',
    code: `<span class="sel">ul</span> {
  <span class="kw">display</span>: <span class="val">flex</span>;
}
<span class="sel">ul > li</span> {
  <span class="kw">flex-grow</span>: <span class="val">1</span>;
  <span class="kw">flex-basis</span>: <span class="val">100%</span>;
  <span class="kw">flex-shrink</span>: <span class="val">0</span>; <span class="cm">/* ← 이 줄이 문제 */</span>
}`,
    hint: 'basis: 100%인데 shrink: 0이면 어떻게 될까요?',
    opts: [
      'flex-grow 값이 너무 작아서',
      'ul에 width가 없어서',
      'flex-basis: 100%에 flex-shrink: 0을 주면 각 li가 부모 전체 너비를 차지하려 해서 넘쳐버림',
      'display: flex 대신 inline-flex를 써야 해서'
    ],
    ans: 2,
    ex: '<strong>flex-basis: 100%</strong>는 각 아이템이 부모 너비 전체를 기본 크기로 잡습니다. 여기에 <strong>flex-shrink: 0</strong>을 주면 줄어들지 않아 모든 li가 100% 너비로 넘쳐버립니다. shrink를 1로 두거나 basis를 조정해야 합니다.'
  },
  {
    cat: '오류 찾기',
    q: '수직 가운데 정렬을 하려 했는데 작동하지 않습니다. 원인은?',
    code: `<span class="sel">.box</span> {
  <span class="kw">display</span>: <span class="val">flex</span>;
  <span class="kw">justify-content</span>: <span class="val">center</span>; <span class="cm">/* ← 여기를 수정해야 */</span>
  <span class="kw">height</span>: <span class="val">300px</span>;
}`,
    hint: 'row 방향에서 justify-content는 가로 정렬입니다.',
    opts: [
      'height 값이 없어서',
      'display: flex 대신 display: block을 써야 해서',
      'row 방향에서 justify-content는 가로(메인축) 정렬이므로 수직 가운데는 align-items: center로 해야 함',
      'center 값이 잘못됨'
    ],
    ans: 2,
    ex: '<strong>flex-direction: row</strong>(기본)일 때 <strong>justify-content</strong>는 가로(메인축) 정렬입니다. 수직(교차축) 가운데 정렬은 <strong>align-items: center</strong>로 해야 합니다.'
  },
  {
    cat: '오류 찾기',
    q: '핀텐 예제처럼 section 안 요소들을 가로로 나열하고 사이 간격을 주려 합니다. 잘못된 속성은?',
    code: `<span class="sel">section</span> {
  <span class="kw">display</span>: <span class="val">flex</span>;
  <span class="kw">justify-content</span>: <span class="val">space-between</span>;
  <span class="kw">margin-gap</span>: <span class="val">20px</span>; <span class="cm">/* ← 잘못된 속성 */</span>
}`,
    hint: 'flex에서 간격을 주는 올바른 속성명은 따로 있습니다.',
    opts: [
      'justify-content 값이 잘못됨',
      'margin-gap은 존재하지 않는 속성, 올바른 속성은 gap (또는 column-gap)',
      'display: flex 대신 display: grid를 써야 함',
      'section에 width가 없어서'
    ],
    ans: 1,
    ex: '<strong>margin-gap</strong>은 존재하지 않는 속성입니다. flex에서 아이템 사이 간격을 줄 때는 <strong>gap</strong>, <strong>column-gap</strong>, <strong>row-gap</strong>을 사용합니다. 핀텐 예제에서도 column-gap: 20px로 카드 사이 간격을 줬습니다.'
  }
];

let cur = 0;
let answered = new Array(Q.length).fill(null);
let sel = new Array(Q.length).fill(null);

function render() {
  const q = Q[cur];
  const pct = (cur / Q.length) * 100;
  document.getElementById('prog').style.width = pct + '%';
  const isDone = answered[cur] !== null;
  const userSel = sel[cur];

  let optsHTML = q.opts.map((o, i) => {
    let cls = '';
    if (isDone) {
      if (i === q.ans) cls = 'correct';
      else if (i === userSel) cls = 'wrong';
    }
    return `<button class="opt-btn ${cls}" onclick="choose(${i})" ${isDone ? 'disabled' : ''}>${o}</button>`;
  }).join('');

  const codeHTML = q.code ? `<div class="code-block">${q.code}</div>` : '';
  const exHTML = isDone ? `<div class="explanation">💡 ${q.ex}</div>` : '';
  const isLast = cur === Q.length - 1;

  document.getElementById('qa').innerHTML = `
    <div class="q-meta">
      <span class="q-num">${cur + 1} / ${Q.length}</span>
      <span class="q-cat">${q.cat}</span>
    </div>
    <div class="q-text">${q.q}</div>
    <div class="hint-box">💡 힌트: ${q.hint}</div>
    ${codeHTML}
    <div class="opts">${optsHTML}</div>
    ${exHTML}
    <div class="nav">
      <button class="nav-btn ghost" onclick="go(-1)" ${cur === 0 ? 'disabled' : ''}>← 이전</button>
      ${isLast
        ? `<button class="result-btn" onclick="showScore()">결과 보기 🎉</button>`
        : `<button class="nav-btn" onclick="go(1)">다음 →</button>`}
    </div>
  `;
}

function choose(i) {
  if (answered[cur] !== null) return;
  sel[cur] = i;
  answered[cur] = i === Q[cur].ans ? 'correct' : 'wrong';
  render();
}

function go(d) {
  cur = Math.max(0, Math.min(Q.length - 1, cur + d));
  render();
}

function showScore() {
  const correct = answered.filter(a => a === 'correct').length;
  const wrong = answered.filter(a => a === 'wrong').length;
  const skip = answered.filter(a => a === null).length;
  const pct = Math.round((correct / Q.length) * 100);
  document.getElementById('prog').style.width = '100%';

  let msg = '';
  if (pct >= 90) msg = 'flex 마스터! 피그마 오토레이아웃도 완벽하겠는데 🏆';
  else if (pct >= 70) msg = '잘했어! 헷갈리는 부분만 다시 보면 완벽 👍';
  else if (pct >= 50) msg = '절반은 맞았어! grow/shrink/basis 개념 다시 보자 💪';
  else msg = '메인축과 교차축 개념부터 다시 정리해보자 📖';

  document.getElementById('qa').innerHTML = `
    <div class="score-box">
      <div class="score-title">퀴즈 완료!</div>
      <div class="score-pct">${pct}%</div>
      <div class="score-msg">${msg}</div>
      <div class="score-grid">
        <div class="score-cell c"><div class="sc-num">${correct}</div><div class="sc-lbl">정답</div></div>
        <div class="score-cell w"><div class="sc-num">${wrong}</div><div class="sc-lbl">오답</div></div>
        <div class="score-cell s"><div class="sc-num">${skip}</div><div class="sc-lbl">미응답</div></div>
      </div>
      <button class="retry-btn" onclick="retry()">처음부터 다시 풀기 🔄</button>
    </div>
  `;
}

function retry() {
  cur = 0;
  answered = new Array(Q.length).fill(null);
  sel = new Array(Q.length).fill(null);
  render();
}

render();
</script>
</body>
</html>
